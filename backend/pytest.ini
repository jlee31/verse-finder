[pytest]
# `pytest` from backend/ needs app/ and evals/ importable.
pythonpath = .
testpaths = evals tests
markers =
    slow: loads the mpnet model / embedding matrix (~20s startup)
    live: makes a real Anthropic API call (costs money)
# Fast by default; opt in with `-m slow`, `-m live`, or `-m ""` for everything.
addopts = -m "not slow and not live"
filterwarnings =
    # starlette 0.27's TestClient calls httpx with the deprecated `app=`
    # shortcut. Ours to fix only by bumping FastAPI; until then it fires on
    # every API test and drowns out warnings that would matter.
    ignore:The 'app' shortcut is now deprecated:DeprecationWarning
