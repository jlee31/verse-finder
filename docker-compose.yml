version: '3.8'

services:
  # Serves both the API and the static frontend — see app/main.py's static
  # mount. There used to be a second "frontend" service here running Vite,
  # but frontend/ never had a package.json, so it never actually worked.
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
