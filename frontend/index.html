<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote Finder — a tiny RAG</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Quote Finder</h1>
      <p class="sub">
        Retrieval-augmented: we find the most relevant quotes, then Claude
        reflects on them.
      </p>

      <form id="form">
        <textarea
          id="prompt"
          placeholder="Tell me what's on your mind…"
          required
        ></textarea>
        <button type="submit" id="submit">Reflect</button>
      </form>

      <div id="output"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
