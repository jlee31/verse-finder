<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote Finder — a tiny RAG</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Quote Finder</h1>
      <p class="sub">
        Retrieval-augmented: we find the most relevant quotes, then Claude
        reflects on them.
      </p>

      <form id="form">
        <textarea
          id="prompt"
          placeholder="Tell me what's on your mind…"
          required
        ></textarea>

        <!--
          The same question, three ways. One-shot searches once and averages a
          compound feeling into a vector that matches neither half; the two
          agent modes decide for themselves how many times to search, and show
          you what they searched for.
        -->
        <fieldset class="modes">
          <legend>How to search</legend>
          <label>
            <input type="radio" name="mode" value="baseline" checked />
            One-shot <span class="hint">single lookup, fast</span>
          </label>
          <label>
            <input type="radio" name="mode" value="handrolled" />
            Agent <span class="hint">hand-rolled loop, ~15s</span>
          </label>
          <label>
            <input type="radio" name="mode" value="langgraph" />
            Agent <span class="hint">LangGraph, ~15s</span>
          </label>
        </fieldset>

        <button type="submit" id="submit">Reflect</button>
      </form>

      <div id="output"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
